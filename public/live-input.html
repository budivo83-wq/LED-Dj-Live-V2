<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BudiLight · Live Input</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    body{background:#05070b;color:#eafcff;font-family:system-ui,Arial,sans-serif;margin:0;padding:20px}
    .wrap{max-width:980px;margin:0 auto}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .card{background:rgba(10,18,28,.82);border:1px solid rgba(0,255,210,.25);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 0 24px rgba(0,255,210,.08)}
    button{border:1px solid rgba(0,255,210,.35);background:rgba(0,255,210,.08);color:#eaffff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
    button.danger{border-color:rgba(255,80,140,.45);background:rgba(255,40,100,.12)}
    input{background:#07101a;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px;width:100%}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.metric{background:rgba(255,255,255,.045);padding:12px;border-radius:12px}.metric b{display:block;color:#83fff0;font-size:12px;text-transform:uppercase}.metric span{font-size:20px;font-weight:900}.row{display:flex;gap:10px;flex-wrap:wrap}.ok{color:#71ff9a}.bad{color:#ff668d}.hint{opacity:.75;line-height:1.45}pre{white-space:pre-wrap;word-break:break-word;background:#02050a;border-radius:12px;padding:12px;max-height:300px;overflow:auto}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>LIVE INPUT → MASTER FRAMEBUS</h1>
      <div class="row"><button onclick="location.href='index.html'">PERFORMANCE</button><button onclick="location.href='settings.html'">SETTINGS</button></div>
    </div>
    <section class="card">
      <h2>ArtNet vstup</h2>
      <p class="hint">Tahle stránka zapne UDP příjem ArtDmx na Raspi a rovnou přepne výstup na <b>MASTER framebus</b>. Když přijdou živé pakety, fallback animace se přestane používat. Resolume/OLA posílej na IP Raspi, výstup z Raspi jde dál na LED node.</p>
      <div class="grid">
        <label>Bind IP<input id="bindIp" placeholder="prázdné = 0.0.0.0"></label>
        <label>Port<input id="port" value="6454"></label>
        <label>Stripů<input id="stripCount" value="8"></label>
        <label>Pixelů / strip<input id="pixelsPerStrip" value="300"></label>
        <label>Pixelů / universe<input id="pixelsPerUniverse" value="170"></label>
        <label>Start universe<input id="startUniverse" value="0"></label>
        <label>Output node IP<input id="outputIp" value="2.1.1.30"></label>
        <label>Output FPS<input id="fps" value="30"></label>
      </div>
      <div class="row" style="margin-top:12px"><button id="startBtn">START LIVE INPUT + OUTPUT</button><button id="stopBtn" class="danger">STOP</button><button id="refreshBtn">REFRESH</button></div>
    </section>
    <section class="card"><h2>Status</h2><div id="metrics" class="grid"></div><pre id="raw">loading…</pre></section>
  </main>
  <script type="module" src="live-input.js"></script>
</body>
</html>
